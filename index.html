<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>คลังปูนขาว — Pallet Manager v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root { --bg:#0f0e0c; --bg2:#1a1814; --bg3:#242118; --surface:#1e1c18; --surface2:#28261f; --surface3:#33302a; --border:#3a3830; --border2:#4a4840; --text:#f0ead8; --text2:#a09880; --text3:#6a6458; --accent:#e8a44a; --accent2:#c17f3a; --accent-dim:rgba(232,164,74,0.12); --accent-glow:rgba(232,164,74,0.25); --red:#e05c4a; --red-dim:rgba(224,92,74,0.12); --green:#4db87a; --green-dim:rgba(77,184,122,0.12); --orange:#e8894a; --orange-dim:rgba(232,137,74,0.12); --radius:14px; --radius-sm:8px; --font:'Sarabun',sans-serif; --mono:'IBM Plex Mono',monospace; --nav-h:56px; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}
/* (ใส่ CSS เดิมของคุณต่อที่นี่ได้เลยครับ) */
</style>
</head>
<body>

<script>
// --- ฟังก์ชันที่แก้ไขแล้ว ---

function renderQR() {
  const grid = document.getElementById('qr-grid');
  if (!grid) return;
  grid.innerHTML = '';
  PALLET_IDS.forEach(id => {
    const div = document.createElement('div');
    div.className = 'qr-card';
    const qty = DB.pallets[id].qty;
    const qrId = 'qr' + id.replace(/-/g,'');
    div.innerHTML = '<h3>' + id + '</h3><div class="qr-sub">' + qty + ' ถุงปัจจุบัน</div><div class="qr-box" id="' + qrId + '"></div><button class="print-btn" onclick="printQR(\'' + id + '\',\'' + qrId + '\')">🖨️ พิมพ์</button>';
    grid.appendChild(div);
    
    // URL สำหรับ GitHub Pages
    const qrUrl = "https://palakorn-cloud.github.io/warehouse-SR/index.html#pallet=" + id;
    
    new QRCode(document.getElementById(qrId), {
      text: qrUrl, width: 140, height: 140,
      colorDark: '#f0ead8', colorLight: '#1e1c18',
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}

async function syncTransactionOnline(txData) {
  if (!GAS_URL) return false;
  updateSyncBadge('syncing');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors', // แก้ปัญหาการเชื่อมต่อ
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'addTransaction', data: txData })
    });
    updateSyncBadge('ok');
    return true;
  } catch (err) {
    updateSyncBadge('err');
    const q = getRetryQueue();
    if (!q.find(t => t.id === txData.id)) { q.push(txData); saveRetryQueue(q); }
    return false;
  }
}

// --- นำฟังก์ชันเดิมที่เหลือทั้งหมดจากไฟล์ของคุณ (initDB, renderDashboard, ฯลฯ) มาวางต่อที่นี่ ---

</script>
</body>
</html>
