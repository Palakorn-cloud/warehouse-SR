<script>

// ════════ CONSTANTS ════════
const MAX_BAGS      = 50;
const LOW_THRESHOLD = 10;

const PALLET_IDS = [
  'PAL-001',
  'PAL-002',
  'PAL-003',
  'PAL-004',
  'PAL-005',
  'PAL-006',
  'PAL-007',
  'PAL-008'
];

const STORAGE_KEY = 'lw_db_v2';
const GAS_URL_KEY = 'lw_gas_url';
const RETRY_KEY   = 'lw_retry_queue';


// ════════ GAS CONFIG ════════
let GAS_URL =
  localStorage.getItem(GAS_URL_KEY) ||
  'https://script.google.com/macros/s/AKfycby_j1c-1NSal2x3JXZDN7h5KlzTIqW93IeZPNXk3puHtCvK01AEHu7d1-aWne8QTiRrfA/exec';


// ════════ DATABASE ════════
function initDB() {

  const pallets = {};

  PALLET_IDS.forEach(id => {

    pallets[id] = {
      id,
      qty: 0,
      max: MAX_BAGS,
      updatedAt: new Date().toISOString()
    };

  });

  return {
    pallets,
    transactions: []
  };
}

function loadDB() {

  try {

    const raw =
      localStorage.getItem(STORAGE_KEY);

    return raw
      ? JSON.parse(raw)
      : initDB();

  } catch {

    return initDB();
  }
}

function saveDB(db) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(db)
  );
}

let DB = loadDB();


// ════════ STATE ════════
let selectedPallet = null;
let pendingQty     = 0;
let pendingType    = null;


// ════════ TOAST ════════
function showToast(msg, type='info') {

  const t =
    document.getElementById('toast');

  if (!t) return;

  t.textContent = msg;

  t.className =
    'toast show ' + type;

  clearTimeout(t._tid);

  t._tid = setTimeout(() => {

    t.classList.remove('show');

  }, 3500);
}


// ════════ SYNC BADGE ════════
function updateSyncBadge(state) {

  const b =
    document.getElementById('sync-badge');

  if (!b) return;

  b.className = 'sync-badge';

  if (state === 'syncing') {

    b.textContent = '⟳ Syncing...';
    b.classList.add('syncing');

  } else if (state === 'ok') {

    b.textContent = '✓ Synced';
    b.classList.add('ok');

  } else if (state === 'err') {

    b.textContent = '✗ Sync failed';
    b.classList.add('err');

  } else {

    b.textContent = 'localStorage';
  }
}


// ════════ SAVE GAS URL ════════
function saveGasUrl() {

  const val =
    document.getElementById(
      'gas-url-input'
    ).value.trim();

  GAS_URL = val;

  localStorage.setItem(
    GAS_URL_KEY,
    val
  );

  updateSyncBadge(
    val ? 'ok' : 'local'
  );

  showToast(
    '✅ บันทึก URL แล้ว',
    'success'
  );
}


// ════════ TEST CONNECTION ════════
async function testGasConnection() {

  const url =
    document.getElementById(
      'gas-url-input'
    ).value.trim() || GAS_URL;

  const el =
    document.getElementById(
      'gas-test-result'
    );

  if (!url) {

    el.innerHTML =
      '<span style="color:red">กรุณากรอก URL</span>';

    return;
  }

  el.innerHTML =
    '<span style="color:orange">⏳ กำลังเชื่อมต่อ...</span>';

  try {

    const res = await fetch(
      url + '?action=ping',
      {
        method: 'GET',
        cache: 'no-store'
      }
    );

    const json =
      await res.json();

    if (json.status !== 'ok') {

      throw new Error(
        'Invalid response'
      );
    }

    el.innerHTML =
      '<span style="color:lime">✅ เชื่อมต่อสำเร็จ</span>';

    updateSyncBadge('ok');

  } catch (err) {

    el.innerHTML =
      '<span style="color:red">❌ ' +
      err.message +
      '</span>';

    updateSyncBadge('err');
  }
}


// ════════ RETRY QUEUE ════════
function getRetryQueue() {

  try {

    return JSON.parse(
      localStorage.getItem(RETRY_KEY)
      || '[]'
    );

  } catch {

    return [];
  }
}

function saveRetryQueue(q) {

  localStorage.setItem(
    RETRY_KEY,
    JSON.stringify(q)
  );
}


// ════════ LOAD FROM CLOUD ════════
async function loadFromCloud() {

  if (!GAS_URL) return;

  try {

    const res = await fetch(
      GAS_URL + '?action=getStock',
      {
        method: 'GET',
        cache: 'no-store'
      }
    );

    const json =
      await res.json();

    if (
      json.status === 'ok' &&
      Array.isArray(json.data)
    ) {

      json.data.forEach(row => {

        if (!DB.pallets[row.palletId]) {
          return;
        }

        DB.pallets[row.palletId].qty =
          Number(row.qty || 0);

        DB.pallets[row.palletId].updatedAt =
          row.updatedAt ||
          new Date().toISOString();

      });

      saveDB(DB);

      renderDashboard();
      renderPalletGrid();
      renderHistory();
    }

  } catch (err) {

    console.warn(
      'loadFromCloud error',
      err
    );
  }
}


// ════════ ONLINE SYNC ════════
async function syncTransactionOnline(txData) {

  if (!GAS_URL) {

    return false;
  }

  updateSyncBadge('syncing');

  try {

    const res = await fetch(
      GAS_URL,
      {
        method: 'POST',

        redirect: 'follow',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body: JSON.stringify({
          action: 'addTransaction',
          data: txData
        })
      }
    );

    if (!res.ok) {

      throw new Error(
        'HTTP ' + res.status
      );
    }

    const text =
      await res.text();

    let json = {};

    try {

      json = JSON.parse(text);

    } catch {

      throw new Error(
        'JSON parse failed'
      );
    }

    if (json.status !== 'ok') {

      throw new Error(
        json.message || 'GAS error'
      );
    }

    updateSyncBadge('ok');

    return true;

  } catch (err) {

    console.error(err);

    updateSyncBadge('err');

    const q =
      getRetryQueue();

    if (
      !q.find(x => x.id === txData.id)
    ) {

      q.push(txData);

      saveRetryQueue(q);
    }

    showToast(
      '⚠️ Sync failed — จะ retry อัตโนมัติ',
      'error'
    );

    return false;
  }
}


// ════════ RETRY PENDING ════════
async function retryPendingSync() {

  const q =
    getRetryQueue();

  if (q.length === 0) return;

  const failed = [];

  for (const tx of q) {

    const ok =
      await syncTransactionOnline(tx);

    if (!ok) {

      failed.push(tx);

    } else {

      const localTx =
        DB.transactions.find(
          t => t.id === tx.id
        );

      if (localTx) {

        localTx.synced = true;
      }
    }
  }

  saveRetryQueue(failed);

  saveDB(DB);
}


// ════════ COMMIT TRANSACTION ════════
async function commitTransaction(type) {

  if (!selectedPallet) return;

  if (pendingQty <= 0) return;

  const emp =
    document.getElementById(
      'emp-select'
    ).value;

  if (!emp) {

    showToast(
      'กรุณาเลือกพนักงาน',
      'error'
    );

    return;
  }

  const pallet =
    DB.pallets[selectedPallet];

  let newQty =
    pallet.qty;

  if (type === 'IN') {

    newQty += pendingQty;

  } else {

    newQty -= pendingQty;
  }

  if (newQty < 0) {

    showToast(
      'สต็อกไม่พอ',
      'error'
    );

    return;
  }

  if (newQty > pallet.max) {

    showToast(
      'เกินความจุ',
      'error'
    );

    return;
  }

  const txData = {

    id:
      'TX' + Date.now(),

    palletId:
      selectedPallet,

    type,

    qty:
      pendingQty,

    newQty,

    employee:
      emp,

    timestamp:
      new Date().toISOString(),

    synced: false
  };


  // LOCAL SAVE FIRST
  pallet.qty       = newQty;
  pallet.updatedAt = txData.timestamp;

  DB.transactions.unshift(txData);

  saveDB(DB);


  renderDashboard();
  renderPalletGrid();
  renderHistory();

  showToast(
    '✅ บันทึกแล้ว',
    'success'
  );


  // CLOUD SYNC
  const ok =
    await syncTransactionOnline(txData);

  if (ok) {

    txData.synced = true;

    saveDB(DB);

    await loadFromCloud();
  }

  closePanel();
}


// ════════ DASHBOARD ════════
function renderDashboard() {

  const total =
    Object.values(DB.pallets)
      .reduce((s,p)=>s+p.qty,0);

  const el =
    document.getElementById(
      'stat-cards'
    );

  if (!el) return;

  el.innerHTML =
    `
    <div class="stat-card">
      <div class="stat-label">
        ถุงรวมทั้งหมด
      </div>

      <div class="stat-value c-acc">
        ${total}
      </div>
    </div>
    `;
}


// ════════ HISTORY ════════
function renderHistory() {

  const tb =
    document.getElementById(
      'history-table'
    );

  if (!tb) return;

  tb.innerHTML =
    DB.transactions.map(t => {

      return `
      <tr>

        <td>
          ${new Date(
            t.timestamp
          ).toLocaleString('th-TH')}
        </td>

        <td>${t.palletId}</td>

        <td>${t.type}</td>

        <td>${t.qty}</td>

        <td>${t.newQty}</td>

        <td>${t.employee}</td>

        <td>
          ${
            t.synced
              ? '✓'
              : '—'
          }
        </td>

      </tr>
      `;

    }).join('');
}


// ════════ PALLET GRID ════════
function renderPalletGrid() {

  const grid =
    document.getElementById(
      'pallet-grid'
    );

  if (!grid) return;

  grid.innerHTML =
    PALLET_IDS.map(id => {

      const p =
        DB.pallets[id];

      return `
      <button
        class="pallet-btn"
        onclick="selectPallet(this,'${id}')"
      >

        <div class="pid">
          ${id}
        </div>

        <div class="pcount">
          ${p.qty} ถุง
        </div>

      </button>
      `;

    }).join('');
}


// ════════ SELECT PALLET ════════
function selectPallet(el, id) {

  selectedPallet = id;

  document
    .querySelectorAll('.pallet-btn')
    .forEach(b =>
      b.classList.remove('selected')
    );

  el.classList.add('selected');

  document.getElementById(
    'qty-panel'
  ).classList.add('show');

  document.getElementById(
    'qp-pid'
  ).textContent = id;

  document.getElementById(
    'qty-number'
  ).textContent =
    DB.pallets[id].qty;
}


// ════════ ADD PENDING ════════
function addPending(qty, type) {

  pendingQty  = qty;
  pendingType = type;

  const box =
    document.getElementById(
      'pending-box'
    );

  box.style.display = 'block';

  box.textContent =
    (type === 'IN' ? '+' : '-') +
    qty +
    ' ถุง';

  document.getElementById(
    'commit-in'
  ).style.display =
    type === 'IN'
      ? 'block'
      : 'none';

  document.getElementById(
    'commit-out'
  ).style.display =
    type === 'OUT'
      ? 'block'
      : 'none';
}


// ════════ CLOSE PANEL ════════
function closePanel() {

  selectedPallet = null;
  pendingQty     = 0;
  pendingType    = null;

  document.getElementById(
    'qty-panel'
  ).classList.remove('show');
}


// ════════ QR AUTO SELECT ════════
function handleQRAutoSelect() {

  const hash =
    window.location.hash;

  if (!hash.includes('pallet=')) {
    return;
  }

  const palletId =
    hash.replace('#pallet=', '');

  if (
    !PALLET_IDS.includes(
      palletId
    )
  ) return;

  showPage('scan');

  setTimeout(() => {

    const idx =
      PALLET_IDS.indexOf(
        palletId
      );

    const btns =
      document.querySelectorAll(
        '.pallet-btn'
      );

    if (btns[idx]) {

      btns[idx].click();
    }

  }, 400);
}


// ════════ NAVIGATION ════════
function showPage(name) {

  document
    .querySelectorAll('.page')
    .forEach(p =>
      p.classList.remove('active')
    );

  document
    .querySelectorAll('.nav-tab')
    .forEach(t =>
      t.classList.remove('active')
    );

  document
    .getElementById(
      'page-' + name
    )
    .classList.add('active');

  const order = [
    'dashboard',
    'scan',
    'history',
    'qrcodes',
    'settings'
  ];

  const tabs =
    document.querySelectorAll(
      '.nav-tab'
    );

  const idx =
    order.indexOf(name);

  if (
    idx >= 0 &&
    tabs[idx]
  ) {

    tabs[idx].classList.add(
      'active'
    );
  }

  if (name === 'dashboard') {
    renderDashboard();
  }

  if (name === 'scan') {
    renderPalletGrid();
  }

  if (name === 'history') {
    renderHistory();
  }
}


// ════════ INIT ════════
(async () => {

  renderPalletGrid();

  renderDashboard();

  renderHistory();

  handleQRAutoSelect();

  await loadFromCloud();

  await retryPendingSync();

})();
</script>
